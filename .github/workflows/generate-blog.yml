name: Generate SEO blog

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_blog.py"
      - "scripts/blog_articles.json"
      - "assets/css/blog.css"
      - "assets/js/blog.js"
      - ".github/workflows/generate-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-seo-blog
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate blog pages from Google Docs
        run: python scripts/generate_blog.py

      - name: Commit generated pages
        run: |
          if git diff --quiet -- blog sitemap.xml; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          git commit -m "Generate SEO blog from Google Docs"
          git push
