name: Minify CSS and JavaScript assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  minify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install minifiers
        run: npm install --no-save terser clean-css-cli

      - name: Show sizes before minification
        run: |
          echo "Before:"
          wc -c assets/css/styles.css assets/css/blog.css assets/js/main.js assets/js/blog.js

      - name: Minify CSS
        run: |
          npx cleancss -O2 -o /tmp/styles.min.css assets/css/styles.css
          npx cleancss -O2 -o /tmp/blog.min.css assets/css/blog.css
          mv /tmp/styles.min.css assets/css/styles.css
          mv /tmp/blog.min.css assets/css/blog.css

      - name: Minify JavaScript
        run: |
          npx terser assets/js/main.js --compress --mangle --output /tmp/main.min.js
          npx terser assets/js/blog.js --compress --mangle --output /tmp/blog.min.js
          mv /tmp/main.min.js assets/js/main.js
          mv /tmp/blog.min.js assets/js/blog.js

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/blog.js

      - name: Show sizes after minification
        run: |
          echo "After:"
          wc -c assets/css/styles.css assets/css/blog.css assets/js/main.js assets/js/blog.js

      - name: Commit minified assets
        run: |
          if git diff --quiet -- assets/css/styles.css assets/css/blog.css assets/js/main.js assets/js/blog.js; then
            echo "Assets are already minified."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/styles.css assets/css/blog.css assets/js/main.js assets/js/blog.js
          git commit -m "Minify CSS and JavaScript assets"
          git push
