name: Fix blog breadcrumb schema

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blog-breadcrumb-schema.yml'

permissions:
  contents: write

jobs:
  fix-breadcrumb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make BreadcrumbList standalone and detectable
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('blog/index.html')
          html = path.read_text(encoding='utf-8')

          # Remove a previous standalone block if this workflow is ever re-run.
          html = re.sub(
              r'<script\s+type="application/ld\+json"\s+id="blog-breadcrumb-schema">.*?</script>',
              '', html, flags=re.S
          )

          pattern = re.compile(r'<script\s+type="application/ld\+json">(.*?)</script>', re.S)
          rebuilt = []
          last = 0
          removed = False

          for m in pattern.finditer(html):
              rebuilt.append(html[last:m.start()])
              raw = m.group(1)
              replacement = m.group(0)
              try:
                  data = json.loads(raw)
              except Exception:
                  data = None

              if isinstance(data, dict) and isinstance(data.get('@graph'), list):
                  new_graph = []
                  for node in data['@graph']:
                      if isinstance(node, dict) and node.get('@type') == 'BreadcrumbList':
                          items = node.get('itemListElement') or []
                          names = [x.get('name') for x in items if isinstance(x, dict)]
                          if names[:2] == ['الرئيسية', 'المدونة']:
                              removed = True
                              continue
                      new_graph.append(node)
                  data['@graph'] = new_graph
                  replacement = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '</script>'

              rebuilt.append(replacement)
              last = m.end()

          rebuilt.append(html[last:])
          html = ''.join(rebuilt)

          breadcrumb = {
              '@context': 'https://schema.org',
              '@type': 'BreadcrumbList',
              '@id': 'https://napoliovenriyadh.com/blog/#breadcrumb',
              'itemListElement': [
                  {
                      '@type': 'ListItem',
                      'position': 1,
                      'name': 'الرئيسية',
                      'item': 'https://napoliovenriyadh.com/'
                  },
                  {
                      '@type': 'ListItem',
                      'position': 2,
                      'name': 'المدونة',
                      'item': 'https://napoliovenriyadh.com/blog/'
                  }
              ]
          }
          standalone = '<script type="application/ld+json" id="blog-breadcrumb-schema">' + json.dumps(breadcrumb, ensure_ascii=False, separators=(',', ':')) + '</script>'

          if '</head>' not in html:
              raise SystemExit('Could not find </head> in blog/index.html')
          html = html.replace('</head>', standalone + '</head>', 1)

          # Add a visible breadcrumb trail too, keeping schema and rendered UX aligned.
          if 'class="breadcrumbs"' not in html:
              visible = '<nav class="breadcrumbs container" aria-label="مسار التنقل"><a href="../">الرئيسية</a><span aria-hidden="true"> / </span><span aria-current="page">المدونة</span></nav>'
              html = html.replace('<main id="main">', '<main id="main">' + visible, 1)

          path.write_text(html, encoding='utf-8')
          print('Standalone BreadcrumbList added. Removed nested copy:', removed)
          PY

      - name: Commit SEO fix
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html
          git commit -m "Fix blog BreadcrumbList schema detection"
          git push
